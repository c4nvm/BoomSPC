# Builds the Linux and Windows zips for a release tag (v0.4.0 and so on) and
# publishes them on the GitHub release. Run by hand to get the zips as
# workflow artifacts without a release.
name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04   # SDL2 2.30; 22.04 has 2.0.20 which lacks SDL_RenderGetWindow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog and git describe need the history and tags
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libsdl2-dev zlib1g-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target boomspc boomspc_assets spc2wav spcdump
      - name: Package
        # Debug info is split off so crash.log addresses resolve against the
        # symbols artifact: addr2line -e boomspc.debug -f -C 0x...
        run: |
          pkg=BoomSPC-linux-x64
          mkdir -p $pkg symbols
          objcopy --only-keep-debug build/boomspc symbols/boomspc.debug
          strip --strip-debug build/boomspc
          cp build/boomspc build/spc2wav build/spcdump README.md LICENSE $pkg/
          cp -r assets $pkg/
          tar -czf $pkg.tar.gz $pkg
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: BoomSPC-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux
          path: symbols/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false   # or the tree looks modified to the version stamp
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-zlib
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target boomspc boomspc_assets spc2wav spcdump
      - name: Package
        # The C++ runtime is linked statically; SDL2 and zlib come along as DLLs.
        # Debug info goes to the symbols artifact (see the linux job).
        run: |
          pkg=BoomSPC-windows-x64
          mkdir -p $pkg symbols
          objcopy --only-keep-debug build/boomspc.exe symbols/boomspc.exe.debug
          strip --strip-debug build/boomspc.exe
          cp build/boomspc.exe build/spc2wav.exe build/spcdump.exe README.md LICENSE $pkg/
          cp -r assets $pkg/
          for exe in $pkg/*.exe; do
            ldd "$exe" | { grep -i '/ucrt64/' || true; } | awk '{print $3}' | xargs -r -I{} cp -n {} $pkg/
          done
          ls $pkg
          zip -r $pkg.zip $pkg
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: BoomSPC-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows
          path: symbols/

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          gh release create "$tag" --title "BoomSPC $tag" --generate-notes \
            dist/BoomSPC-linux-x64.tar.gz dist/BoomSPC-windows-x64.zip
